<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gemini Notebook MCP</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body class="popup-root">

    <!-- ================================================================
         Top Bar
         ================================================================ -->
    <header class="top-bar">
      <!-- Logo / product name -->
      <div class="top-bar__logo">
        <!-- BookOpen icon (Lucide, stroke 1.75px) -->
        <svg
          class="icon icon--book"
          xmlns="http://www.w3.org/2000/svg"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.75"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          focusable="false"
        >
          <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
          <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
        </svg>
        <span class="top-bar__title" data-i18n="productName">Gemini Notebook MCP</span>
      </div>

      <!-- Connection health badge -->
      <div class="top-bar__badges">
        <!-- ShieldCheck icon (Lucide, stroke 1.75px) -->
        <svg
          id="icon-shield"
          class="icon icon--shield"
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.75"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          focusable="false"
        >
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <polyline points="9 12 11 14 15 10"/>
        </svg>

        <!-- Radio icon (Lucide, stroke 1.75px) -->
        <svg
          id="icon-radio"
          class="icon icon--radio"
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.75"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          focusable="false"
        >
          <circle cx="12" cy="12" r="2"/>
          <path d="M16.24 7.76a6 6 0 0 1 0 8.49m-8.48-.01a6 6 0 0 1 0-8.49m11.31-2.82a10 10 0 0 1 0 14.14m-14.14 0a10 10 0 0 1 0-14.14"/>
        </svg>

        <span
          id="connection-health-badge"
          class="badge badge--disconnected"
          role="status"
          aria-live="polite"
          data-i18n="statusDisconnected"
        >Disconnected</span>

        <span
          id="account-badge"
          class="badge badge--account"
          aria-label="Active Google account"
        ></span>
      </div>
    </header>

    <!-- ================================================================
         Main Viewport
         ================================================================ -->
    <main class="main-viewport">
      <h2 class="section-heading" data-i18n="notebooksHeading">Allowlisted Notebooks</h2>

      <ul
        id="notebook-list"
        class="notebook-list"
        role="list"
        aria-label="Allowlisted notebooks"
      >
        <!-- Populated dynamically by popup.js -->
        <li class="notebook-list__empty" id="notebook-list-empty" data-i18n="notebooksEmpty">
          No notebooks allowlisted yet.
        </li>
      </ul>
    </main>

    <!-- ================================================================
         Action Bar
         ================================================================ -->
    <footer class="action-bar">
      <button
        id="connect-button"
        class="btn btn--primary"
        type="button"
        data-i18n="connectButton"
        aria-label="Connect this browser to the MCP gateway"
      >
        Connect this Browser
      </button>

      <a
        id="docs-link"
        class="action-bar__docs-link"
        href="https://github.com/google-notebook-mcp/docs"
        target="_blank"
        rel="noopener noreferrer"
        data-i18n="docsLink"
      >
        Docs
      </a>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
